# Local stand-in for R2 (MinIO) and R2 Data Catalog (apache/iceberg-rest-fixture).
# Used to separate "iceberg-go / Parquet / REST protocol" failures from
# R2-specific ones, as required by the #36 Failure Rule.
services:
  minio:
    image: quay.io/minio/minio@sha256:e9e29897d0c5520a20ef77a4819a1e523ebcb521f19ad200fdc570f1a01913ca
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dwhspike
      MINIO_ROOT_PASSWORD: dwhspike-secret
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/mc@sha256:fbd6f17a724fa14b7b295e83df170d9442000a3177bd8179ea8f8de6a1cebafd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dwhspike dwhspike-secret &&
      mc mb -p local/dwh-observations &&
      mc mb -p local/dwh-canonical &&
      mc mb -p local/dwh-control &&
      exit 0"

  iceberg-rest:
    image: apache/iceberg-rest-fixture@sha256:ae68f294f1a8042310c257cef8fab21fd9f78569f650a101d8731cb1a7430864
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: dwhspike
      AWS_SECRET_ACCESS_KEY: dwhspike-secret
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://dwh-canonical/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
