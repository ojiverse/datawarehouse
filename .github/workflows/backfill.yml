name: backfill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm/action-setup reads the exact version from the root package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest in workerd)
        run: pnpm test

      - name: Wrangler dry-run (dev)
        working-directory: workers/backfill
        run: pnpm exec wrangler deploy --dry-run --env dev --outdir "${RUNNER_TEMP}/wrangler-dry-run"
